<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
        --accent: #6d5dfc;
        --radius: 12px;
        --border: color-mix(in srgb, CanvasText 18%, transparent);
        --field: color-mix(in srgb, CanvasText 4%, Canvas);
      }
      :root[data-theme="dark"] { color-scheme: dark; }
      :root[data-theme="light"] { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px 20px 60px; background: Canvas; color: CanvasText; }
      main { width: min(600px, 100%); margin: 0 auto; }
      @media (min-width: 900px) {
        main {
          width: min(980px, 100%);
          display: grid; gap: 0 28px; align-items: start;
          grid-template-columns: minmax(0, 1fr) 380px;
          grid-template-areas:
            "head   head"
            "sub    sub"
            "tabs   side"
            "panel  side"
            "styles side";
        }
        main .head, main .sub { grid-column: 1 / -1; }
        .tabs { grid-area: tabs; align-self: end; }
        .panel { grid-area: panel; }
        #styleBox { grid-area: styles; margin-top: 14px; }
        .colR { grid-area: side; position: sticky; top: 16px; align-self: start; }
      }
      .head { display: flex; align-items: center; gap: 11px; }
      .head img, .head svg { width: 38px; height: 38px; border-radius: 9px; flex: none; }
      h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
      .sub { margin: 7px 0 16px; font-size: 13px; line-height: 1.55; opacity: .68; }

      .tabs { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
      .tab {
        appearance: none; border: 0; background: none; color: inherit; font: inherit; font-size: 13.5px;
        font-weight: 600; padding: 9px 14px; cursor: pointer; opacity: .62;
        border-bottom: 2px solid transparent; margin-bottom: -1px;
      }
      .tab[aria-selected="true"] { opacity: 1; color: var(--accent); border-bottom-color: var(--accent); }
      .panel { display: none; }
      .panel.active { display: block; }

      textarea, input[type="text"], input[type="password"], select {
        width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--field); color: inherit; font: inherit; font-size: 13.5px; outline: none;
      }
      textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
      textarea:focus, input[type="text"]:focus, input[type="password"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
      .field { margin-bottom: 10px; }
      .field label { display: block; font-size: 12px; font-weight: 600; opacity: .72; margin-bottom: 5px; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      .row > .check { flex: 0 0 auto; align-self: flex-end; margin: 0 0 10px; white-space: nowrap; }
      .check { display: flex; align-items: center; gap: 7px; font-size: 13px; opacity: .85; cursor: pointer; margin: 2px 0 10px; }
      .check input { accent-color: var(--accent); width: 15px; height: 15px; }

      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
      .colorfield { display: flex; align-items: center; gap: 8px; }
      .colorfield input[type="color"] {
        width: 38px; height: 30px; padding: 2px; border: 1px solid var(--border); border-radius: 8px;
        background: var(--field); cursor: pointer;
      }
      .colorfield input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      .colorfield input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 5px; }
      .colorfield input[type="text"] { flex: 1; min-width: 0; padding: 7px 9px; font-size: 12.5px; }
      .sliderrow { display: flex; align-items: center; gap: 10px; }
      .sliderrow input[type="range"] { flex: 1; accent-color: var(--accent); }
      .sliderrow .val { font-size: 12px; opacity: .65; min-width: 26px; text-align: right; }
      .hint { font-size: 11.5px; opacity: .55; margin: 4px 0 10px; line-height: 1.5; }
      .logo-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .logo-preview { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); object-fit: contain; background: #fff; }
      .ghostbtn {
        border: 1px solid var(--border); background: none; color: inherit; font: inherit; font-size: 12px;
        border-radius: 8px; padding: 6px 11px; cursor: pointer; opacity: .8;
      }
      .ghostbtn:hover { opacity: 1; }
      input[type="file"] { display: none; }
      .filebtn {
        display: inline-block; border: 1px dashed var(--border); border-radius: 8px; padding: 7px 13px;
        font-size: 12.5px; cursor: pointer; opacity: .8;
      }
      .filebtn:hover { opacity: 1; border-color: var(--accent); }

      .meta { font-size: 11.5px; opacity: .55; margin: 4px 0 0; }
      .meta.warn { color: #d97706; opacity: 1; font-weight: 600; }
      .empty-msg { margin: 0; }
      .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
      .chip {
        border: 1px solid var(--border); background: var(--field); color: inherit; font: inherit;
        font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer; opacity: .85;
      }
      .chip:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
      .preview {
        margin-top: 14px; display: grid; place-items: center; gap: 8px; min-height: 268px; padding: 20px;
        border-radius: var(--radius); border: 1px dashed var(--border);
        background:
          repeating-conic-gradient(color-mix(in srgb, CanvasText 6%, Canvas) 0% 25%, Canvas 0% 50%) 0 0 / 22px 22px;
      }
      .preview.solid { background: color-mix(in srgb, CanvasText 3%, Canvas); }
      #canvas { display: none; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.18); max-width: 236px; width: 236px; height: auto; }
      @media (min-width: 900px) { #canvas { width: 336px; max-width: 100%; } }
      #empty { font-size: 13px; opacity: .55; text-align: center; line-height: 1.6; background: Canvas; border-radius: 8px; padding: 4px 10px; }
      #error { display: none; font-size: 13px; color: #e5484d; text-align: center; line-height: 1.6; background: Canvas; border-radius: 8px; padding: 4px 10px; }

      .actions { display: flex; flex-direction: column; gap: 9px; margin-top: 15px; }
      .actions-sub { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
      .actions-sub select { width: auto; padding: 8px 8px; font-size: 12.5px; flex: none; }
      .actions-sub .act { flex: 1; min-width: 0; }
      button.act {
        flex: 1; min-width: 110px; border: 0; border-radius: 11px; padding: 11px 14px; font: inherit;
        font-size: 13.5px; font-weight: 600; cursor: pointer;
      }
      #save { background: var(--accent); color: #fff; }
      button.act:disabled { opacity: .4; cursor: not-allowed; }
      .secondary { background: transparent !important; color: inherit !important; border: 1px solid var(--border) !important; }
      #error .errbtn { margin-top: 8px; }
      @media (max-width: 639px) {
        .grid2 { grid-template-columns: 1fr; }
        .actions {
          position: sticky; bottom: 0; z-index: 5;
          margin: 12px -20px 0; padding: 10px 20px;
          background: Canvas; border-top: 1px solid var(--border);
        }
      }

      details.styleset { margin-top: 2px; border: 1px solid var(--border); border-radius: var(--radius); }
      #vcMore { margin-top: 10px; }
      #vcMore .grid2 { margin-bottom: 10px; }
      details.styleset summary {
        display: flex; align-items: center; padding: 10px 14px; cursor: pointer; font-size: 13px;
        font-weight: 600; list-style: none; user-select: none; opacity: .85;
      }
      details.styleset summary::-webkit-details-marker { display: none; }
      details.styleset summary::after { content: "▸"; margin-left: 12px; opacity: .5; font-size: 11px; transition: transform .15s ease; }
      details.styleset summary .summary-reset { margin-left: auto; }
      .rowcolors { display: grid; grid-template-columns: 1.15fr 1.15fr auto; gap: 6px 14px; align-items: end; margin-bottom: 10px; }
      .rowcolors .check { margin: 0 0 8px; white-space: nowrap; }
      .row2col { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-bottom: 10px; }
      .row2col .field { margin-bottom: 0; }
      .row2col select { width: 100%; }
      .shapeseg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--field); }
      .shapeopt { padding: 8px 16px; border: 0; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; opacity: .5; }
      .shapeopt + .shapeopt { border-left: 1px solid var(--border); }
      .shapeopt[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 24%, Canvas); color: var(--accent); opacity: 1; }
      details.styleset[open] summary::after { transform: rotate(90deg); }
      details.styleset .stylebody { padding: 2px 14px 12px; }
      details.history { margin-top: 20px; border: 1px solid var(--border); border-radius: var(--radius); }
      details.history summary {
        display: flex; align-items: center; padding: 11px 14px; cursor: pointer; font-size: 13px;
        font-weight: 600; list-style: none; user-select: none;
      }
      details.history summary::-webkit-details-marker { display: none; }
      details.history summary .count { margin-left: 6px; font-weight: 400; opacity: .55; }
      details.history summary .spacer { flex: 1; }
      #clearHistory { display: none; }
      details.history[open] #clearHistory { display: inline-block; }
      #historyList { max-height: 240px; overflow: auto; padding: 0 8px 8px; }
      .hitem {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px;
        cursor: pointer; font-size: 12.5px;
      }
      .hitem:hover { background: color-mix(in srgb, CanvasText 6%, Canvas); }
      .hitem .badge {
        flex: none; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
        background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
      }
      .hitem .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
      .hitem .time { flex: none; font-size: 11px; opacity: .45; }
      .hitem .del {
        flex: none; width: 20px; height: 20px; border: 0; border-radius: 6px; background: none; color: inherit;
        opacity: .4; cursor: pointer; font-size: 14px; line-height: 1;
      }
      .hitem .del:hover { opacity: 1; background: color-mix(in srgb, #e5484d 18%, transparent); color: #e5484d; }
      .hempty { text-align: center; font-size: 12px; opacity: .5; padding: 14px 0 10px; }

      #modalMask {
        position: fixed; inset: 0; display: none; place-items: center; z-index: 50;
        background: rgba(0,0,0,.42);
      }
      #modalMask.show { display: grid; }
      #modal {
        width: min(340px, 88vw); padding: 20px; border-radius: 14px;
        background: Canvas; color: CanvasText; box-shadow: 0 24px 70px rgba(0,0,0,.35);
      }
      #modalTitle { margin: 0 0 8px; font-size: 15px; font-weight: 700; }
      #modalBody { margin: 0 0 16px; font-size: 13px; line-height: 1.6; opacity: .75; }
      .modal-actions { display: flex; gap: 10px; }
      .modal-actions button {
        flex: 1; border: 0; border-radius: 10px; padding: 10px 14px; font: inherit;
        font-size: 13px; font-weight: 600; cursor: pointer;
      }
      #modalCancel {
        background: transparent; color: inherit;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      }
      #modalConfirm { background: #e5484d; color: #fff; }
      #toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px);
        padding: 9px 16px; border-radius: 10px; font-size: 12.5px; max-width: 86vw;
        background: color-mix(in srgb, CanvasText 90%, Canvas); color: Canvas;
        opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <main>
      <div class="head">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QR Code Generator">
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
 <stop stop-color="#7c6bff"/>
 <stop offset="1" stop-color="#5b4ee0"/>
 </linearGradient>
 </defs>
 <rect width="64" height="64" rx="14" fill="url(#bg)"/>
 <g fill="#ffffff">
 <rect x="10" y="10" width="15" height="15" rx="3.5"/>
 <rect x="39" y="10" width="15" height="15" rx="3.5"/>
 <rect x="10" y="39" width="15" height="15" rx="3.5"/>
 </g>
 <g fill="url(#bg)">
 <rect x="14" y="14" width="7" height="7" rx="1.5"/>
 <rect x="43" y="14" width="7" height="7" rx="1.5"/>
 <rect x="14" y="43" width="7" height="7" rx="1.5"/>
 </g>
 <g fill="#ffffff">
 <rect x="39" y="39" width="5" height="5" rx="1.2"/>
 <rect x="46" y="39" width="5" height="5" rx="1.2"/>
 <rect x="53" y="39" width="1.5" height="5" rx="0.6"/>
 <rect x="39" y="46" width="5" height="5" rx="1.2"/>
 <rect x="46" y="46" width="5" height="5" rx="1.2"/>
 <rect x="53" y="46" width="1.5" height="5" rx="0.6"/>
 <rect x="39" y="53" width="1.5" height="1.5" rx="0.6"/>
 <rect x="43" y="53" width="5" height="1.5" rx="0.6"/>
 <rect x="50" y="53" width="1.5" height="1.5" rx="0.6"/>
 <rect x="53" y="53" width="1.5" height="1.5" rx="0.6"/>
 <rect x="29" y="10" width="4" height="4" rx="1"/>
 <rect x="29" y="17" width="4" height="4" rx="1"/>
 <rect x="29" y="28" width="4" height="4" rx="1"/>
 <rect x="10" y="29" width="4" height="4" rx="1"/>
 <rect x="17" y="29" width="4" height="4" rx="1"/>
 <rect x="28" y="39" width="4" height="4" rx="1"/>
 <rect x="28" y="46" width="4" height="4" rx="1"/>
 <rect x="28" y="53" width="4" height="4" rx="1"/>
 </g>
 </svg>
 
        <h1 id="title"></h1>
      </div>
      <p class="sub" id="subtitle"></p>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="text" aria-selected="true" type="button"></button>
        <button class="tab" role="tab" data-tab="wifi" aria-selected="false" type="button"></button>
        <button class="tab" role="tab" data-tab="vcard" aria-selected="false" type="button"></button>
      </div>

      <div class="panel active" data-panel="text">
        <textarea id="textContent" spellcheck="false"></textarea>
        <p class="meta" id="textMeta"></p>
      </div>

      <div class="panel" data-panel="wifi">
        <div class="field"><label id="wifiSsidLabel"></label><input type="text" id="wifiSsid" maxlength="32" /></div>
        <div class="field"><label id="wifiPassLabel"></label><input type="password" id="wifiPass" maxlength="64" /></div>
        <div class="row">
          <div class="field"><label id="wifiEncLabel"></label>
            <select id="wifiEnc">
              <option value="WPA"></option>
              <option value="WEP"></option>
              <option value="nopass"></option>
            </select>
          </div>
          <label class="check"><input type="checkbox" id="wifiHidden" /><span id="wifiHiddenLabel"></span></label>
        </div>
        <p class="meta" id="wifiMeta"></p>
      </div>

      <div class="panel" data-panel="vcard">
        <div class="grid2">
          <div class="field"><label id="vcNameLabel"></label><input type="text" id="vcName" maxlength="64" /></div>
          <div class="field"><label id="vcPhoneLabel"></label><input type="text" id="vcPhone" maxlength="32" /></div>
        </div>
        <details class="styleset" id="vcMore">
          <summary><span id="vcMoreLabel"></span></summary>
          <div class="stylebody">
            <div class="grid2">
              <div class="field"><label id="vcEmailLabel"></label><input type="text" id="vcEmail" maxlength="96" /></div>
              <div class="field"><label id="vcUrlLabel"></label><input type="text" id="vcUrl" maxlength="128" /></div>
              <div class="field"><label id="vcOrgLabel"></label><input type="text" id="vcOrg" maxlength="64" /></div>
              <div class="field"><label id="vcTitleLabel"></label><input type="text" id="vcTitle" maxlength="64" /></div>
            </div>
            <div class="field"><label id="vcNoteLabel"></label><input type="text" id="vcNote" maxlength="128" /></div>
          </div>
        </details>
        <p class="meta" id="vcardMeta"></p>
      </div>

      <aside class="colR">
        <section class="preview solid" id="preview">
          <canvas id="canvas" width="480" height="480"></canvas>
          <div id="empty"></div>
          <div id="error"></div>
        </section>

        <div class="actions">
          <button class="act" id="save" type="button" disabled></button>
          <div class="actions-sub">
            <select id="px" aria-label="PNG size">
              <option value="256">256px</option>
              <option value="512" selected>512px</option>
              <option value="1024">1024px</option>
            </select>
            <button class="act secondary" id="copyImg" type="button" disabled></button>
            <button class="act secondary" id="copyText" type="button" disabled></button>
          </div>
        </div>

        <details class="history" id="historyBox">
          <summary>
            <span id="historyLabel"></span><span class="count" id="historyCount"></span>
            <span class="spacer"></span>
            <button class="ghostbtn" id="clearHistory" type="button"></button>
          </summary>
          <div id="historyList"></div>
        </details>
      </aside>

      <details class="styleset" id="styleBox">
        <summary><span id="styleSummary"></span><button class="ghostbtn summary-reset" id="resetStyle" type="button"></button></summary>
        <div class="stylebody">
          <div class="field"><label id="logoLabel"></label>
            <div class="logo-actions">
              <label class="filebtn" for="logoFile" id="logoPickLabel"></label>
              <input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" />
              <img id="logoPreview" class="logo-preview" style="display:none" alt="" />
              <div class="sliderrow" id="logoScaleRow" style="display:none; flex:1; min-width:150px">
                <input type="range" id="logoScale" min="12" max="30" step="1" value="20" style="flex:1" /><span class="val" id="logoScaleVal">20%</span>
              </div>
              <button class="ghostbtn" id="logoClear" type="button" style="display:none"></button>
            </div>
            <p class="hint" id="logoHint"></p>
          </div>

          <div class="rowcolors">
            <div class="field"><label id="fgLabel"></label>
              <div class="colorfield"><input type="color" id="fgColor" value="#111111" /><input type="text" id="fgHex" value="#111111" maxlength="7" spellcheck="false" /></div>
            </div>
            <div class="field"><label id="bgLabel"></label>
              <div class="colorfield"><input type="color" id="bgColor" value="#ffffff" /><input type="text" id="bgHex" value="#ffffff" maxlength="7" spellcheck="false" /></div>
            </div>
            <label class="check transcheck"><input type="checkbox" id="transparent" /><span id="transparentLabel"></span></label>
          </div>

          <div class="row2col">
            <div class="field"><label id="shapeLabel"></label>
              <div class="shapeseg" role="radiogroup">
                <button type="button" class="shapeopt" data-shape="square" aria-pressed="true">
                  <svg viewBox="0 0 18 18" width="17" height="17" fill="currentColor" aria-hidden="true"><rect x="2.5" y="2.5" width="5.6" height="5.6" rx="0.7"/><rect x="9.9" y="2.5" width="5.6" height="5.6" rx="0.7"/><rect x="2.5" y="9.9" width="5.6" height="5.6" rx="0.7"/><rect x="9.9" y="9.9" width="5.6" height="5.6" rx="0.7"/></svg>
                </button>
                <button type="button" class="shapeopt" data-shape="rounded" aria-pressed="false">
                  <svg viewBox="0 0 18 18" width="17" height="17" fill="currentColor" aria-hidden="true"><rect x="2.5" y="2.5" width="5.6" height="5.6" rx="2.2"/><rect x="9.9" y="2.5" width="5.6" height="5.6" rx="2.2"/><rect x="2.5" y="9.9" width="5.6" height="5.6" rx="2.2"/><rect x="9.9" y="9.9" width="5.6" height="5.6" rx="2.2"/></svg>
                </button>
                <button type="button" class="shapeopt" data-shape="dots" aria-pressed="false">
                  <svg viewBox="0 0 18 18" width="17" height="17" fill="currentColor" aria-hidden="true"><circle cx="5.3" cy="5.3" r="2.9"/><circle cx="12.7" cy="5.3" r="2.9"/><circle cx="5.3" cy="12.7" r="2.9"/><circle cx="12.7" cy="12.7" r="2.9"/></svg>
                </button>
              </div>
            </div>
            <div class="field"><label id="eccLabel"></label>
              <select id="ecc">
                <option value="L"></option>
                <option value="M" selected></option>
                <option value="Q"></option>
                <option value="H"></option>
              </select>
            </div>
          </div>

          <div class="field"><label id="marginLabel"></label>
            <div class="sliderrow"><input type="range" id="margin" min="0" max="8" step="1" value="4" /><span class="val" id="marginVal">4</span></div>
          </div>
        </div>
      </details>
    </main>
    <div id="modalMask">
      <div id="modal" role="dialog" aria-modal="true">
        <p id="modalTitle"></p>
        <p id="modalBody"></p>
        <div class="modal-actions">
          <button id="modalCancel" type="button"></button>
          <button id="modalConfirm" type="button"></button>
        </div>
      </div>
    </div>
    <div id="toast"></div>

      function renderQr(qr, size, s) {

        style.margin = Number($("margin").value);
        $("marginVal").textContent = style.margin;
        scheduleGenerate();
      });
      $("ecc").addEventListener("change", () => { style.ecc = $("ecc").value; scheduleGenerate(); });
      $("transparent").addEventListener("change", () => { style.transparentBg = $("transparent").checked; scheduleGenerate(); });
      $("logoScale").addEventListener("input", () => {
        style.logoScale = Number($("logoScale").value) / 100;
        $("logoScaleVal").textContent = `${$("logoScale").value}%`;
        scheduleGenerate();
      });
      $("logoClear").addEventListener("click", () => {
        if (!style.logo) return;
        openConfirm({
          title: text.style.logoClearTitle,
          body: text.style.logoClearBody,
          confirm: text.style.logoClearConfirm,
          cancel: text.history.cancel,
          onConfirm: () => {
            style.logo = null;
            $("logoFile").value = "";
            syncStyleInputs();
            scheduleGenerate();
          },
        });
      });
      $("logoFile").addEventListener("change", () => {
        const file = $("logoFile").files && $("logoFile").files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            // Downscale for the stored data URL so history entries stay small.
            const max = 96;
            const r = Math.min(1, max / Math.max(img.width, img.height));
            const off = document.createElement("canvas");
            off.width = Math.max(1, Math.round(img.width * r));
            off.height = Math.max(1, Math.round(img.height * r));
            off.getContext("2d").drawImage(img, 0, 0, off.width, off.height);
            style.logo = off.toDataURL("image/png");
            syncStyleInputs();
            scheduleGenerate();
          };
          img.onerror = () => showToast(text.toast.logoFail);
          img.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
      $("resetStyle").addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        Object.assign(style, DEFAULT_STYLE);
        syncStyleInputs();
        scheduleGenerate();
        showToast(text.toast.styleReset);
      });

      // ---------- inputs ----------
      function scheduleGenerate(delay = 300) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(generate, delay);
      }
      $("textContent").addEventListener("input", () => scheduleGenerate());
      for (const id of ["wifiSsid", "wifiPass", "wifiEnc", "wifiHidden", "vcName", "vcPhone", "vcEmail", "vcUrl", "vcOrg", "vcTitle", "vcNote"]) {
        $(id).addEventListener("input", () => scheduleGenerate());
        $(id).addEventListener("change", () => scheduleGenerate());
      }

      // ---------- host glue ----------
      let hostLocale = "";
      let hostAppearance = "";
      try {
        hostLocale = window.dbxPlugin && window.dbxPlugin.locale || "";
        const t = window.dbxPlugin && window.dbxPlugin.theme;
        hostAppearance = t && t.appearance || "";
        if (t && t.tokens && typeof t.tokens === "object") {
          for (const [k, v] of Object.entries(t.tokens)) {
            if (k.startsWith("--")) document.documentElement.style.setProperty(k, v);
          }
        }
      } catch (e) { /* standalone preview outside the host */ }
      if (hostAppearance === "dark" || hostAppearance === "light") document.documentElement.dataset.theme = hostAppearance;
      text = (hostLocale || navigator.language || "en").toLowerCase().startsWith("zh") ? copy.zh : copy.en;
      applyLocale();
      syncStyleInputs();
      loadHistory();
      generate();

      if (window.dbxPlugin && window.dbxPlugin.ready) {
        window.dbxPlugin.ready.then(() => {
          try {
            const l = window.dbxPlugin.locale || "";
            if (l) {
              text = l.toLowerCase().startsWith("zh") ? copy.zh : copy.en;
              applyLocale();
            }
            const t = window.dbxPlugin.theme;
            if (t && (t.appearance === "dark" || t.appearance === "light")) document.documentElement.dataset.theme = t.appearance;
          } catch (e) { /* keep defaults */ }
        }).catch(() => { /* standalone preview */ });
      }
    </script>
  </body>
</html>
